<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1628">
  <title>LAMIC Apoiados</title>
  <link rel="icon" href="https://i.imgur.com/0CfbOl5.png" type="image/png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/0CfbOl5.png">
  <link rel="manifest" href="https://raw.githubusercontent.com/LaboratorioLamic/L2L/refs/heads/main/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    /* ═══════════════════════════════════════════════════════════════
       LAMIC Apoiados (L2L) — mesma identidade visual do COMERCIAL LAMIC
       ═══════════════════════════════════════════════════════════════ */

    /* ── Cores, tipografia e reset ── */
    :root {
      --night: #0e1628; --night-mid: #162036; --night-light: #1e2d4a;
      --cyan: #00a8cc; --cyan-hover: #0090b0; --cyan-light: rgba(0, 168, 204, .12);
      --bg: #f4f7f6; --bg-card: #fff; --bg-soft: #f8fafc;
      --text-primary: #0e1628; --text-secondary: #4a5568; --text-muted: #718096;
      --border: #e2e8f0; --border-hover: #b6c3d4;
      --red: #e63946;   --red-bg: rgba(230, 57, 70, .1);
      --amber: #e8913a; --amber-bg: rgba(244, 162, 97, .16);
      --green: #2a9d8f; --green-bg: rgba(42, 157, 143, .12);
      --gray: #94a3b8;  --gray-bg: rgba(148, 163, 184, .16);
      --topbar-h: 60px;
      --shadow-sm: 0 1px 3px rgba(14, 22, 40, .08);
      --shadow-md: 0 4px 16px rgba(14, 22, 40, .12);
      --shadow-lg: 0 12px 40px rgba(14, 22, 40, .18);
      --radius: 8px; --radius-lg: 12px;
      --t: all .18s ease;
    }
    :root[data-theme="dark"] {
      --bg: #0b1220; --bg-card: #121c30; --bg-soft: #16223a;
      --text-primary: #e6edf7; --text-secondary: #a9b6cc; --text-muted: #7c8aa3;
      --border: #22314f; --border-hover: #36486b;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, .4);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, .45);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, .6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", system-ui, sans-serif; background: var(--bg); color: var(--text-primary); font-size: 14px; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    input, textarea { font-family: inherit; font-size: 14px; }
    .fa-solid { line-height: 1; }
    * { scrollbar-width: thin; scrollbar-color: var(--border-hover) transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }
    .mono { font-family: "DM Mono", monospace; }
    .muted { color: var(--text-muted); }
    .oculto { display: none !important; }

    /* ── Marca ── */
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-ico { width: 36px; height: 36px; border-radius: 9px; background: var(--cyan); color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0, 168, 204, .4); flex-shrink: 0; }
    .brand-name { font-weight: 600; font-size: 14px; color: #fff; }
    .brand-sub { font-size: 10px; letter-spacing: .08em; color: #8fa1bf; text-transform: uppercase; margin-top: 2px; }

    /* ── Tela de acesso ── */
    .auth { position: fixed; inset: 0; background: var(--night); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; overflow-y: auto; }
    .auth.hide { display: none; }
    .auth-card { width: 100%; max-width: 360px; background: var(--night-light); border: 1px solid rgba(255, 255, 255, .08); border-radius: 14px; padding: 32px; box-shadow: var(--shadow-lg); color: #fff; margin: auto; }
    .auth-card .brand { margin-bottom: 28px; }
    .auth-card.shake { animation: tremer .45s; }
    @keyframes tremer { 0%, 100% { transform: none; } 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
    .auth h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .auth p { font-size: 12.5px; color: #8fa1bf; margin-bottom: 18px; line-height: 1.5; }
    .auth label { display: block; font-size: 11.5px; font-weight: 600; color: #a9b6cc; margin: 14px 0 6px; }
    .inp-auth { position: relative; }
    .inp-auth > i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #5f7090; font-size: 13px; }
    .inp-auth input { width: 100%; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .1); border-radius: var(--radius); padding: 10px 40px 10px 36px; color: #fff; outline: none; transition: var(--t); }
    .inp-auth input::placeholder { color: #5f7090; }
    .inp-auth input:focus { border-color: var(--cyan); background: rgba(0, 168, 204, .08); }
    .inp-auth input:disabled { opacity: .5; }
    .ver-senha { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; background: none; color: #5f7090; border-radius: 6px; }
    .ver-senha:hover { color: #fff; }
    .btn-primary { width: 100%; margin-top: 22px; background: var(--cyan); color: #fff; border: 0; border-radius: var(--radius); padding: 11px; font-weight: 600; font-size: 14px; display: flex; gap: 9px; align-items: center; justify-content: center; transition: var(--t); }
    .btn-primary:hover:not(:disabled) { background: var(--cyan-hover); }
    .btn-primary:disabled { opacity: .5; }
    .auth-erro { background: rgba(230, 57, 70, .15); color: #ff8a93; border-radius: var(--radius); padding: 9px 12px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
    .auth-erro:empty { display: none; }
    .auth-load { display: flex; flex-direction: column; align-items: center; gap: 14px; color: #8fa1bf; font-size: 13px; padding: 20px 0 6px; text-align: center; }
    .auth-load i { font-size: 26px; color: var(--cyan); }
    .auth-espera { margin-top: 14px; font-size: 12px; color: var(--amber); display: none; }
    .auth-espera .barra { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .1); overflow: hidden; margin-top: 8px; }
    .auth-espera .barra div { height: 100%; width: 0; background: var(--amber); transition: width 1s linear; }
    .auth-rodape { margin-top: 20px; font-size: 11.5px; color: #5f7090; text-align: center; line-height: 1.5; }
    /* seletor do laboratório dentro do cartão escuro */
    .auth .pop-btn { background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .1); color: #fff; padding: 7px 12px 7px 8px; }
    .auth .pop-btn:hover { border-color: rgba(255, 255, 255, .25); }
    .auth .pop-wrap.open .pop-btn { border-color: var(--cyan); background: rgba(0, 168, 204, .08); box-shadow: none; }
    .auth .pb-ic { background: rgba(255, 255, 255, .08); color: #a9b6cc; }
    .auth .pb-l { color: #8fa1bf; }
    .auth .pb-chev { color: #5f7090; }
    .auth .pop { width: 100%; color: var(--text-primary); }

    /* ── Barra superior e página ── */
    #app { min-height: 100vh; overflow-x: clip; }
    .topbar { height: var(--topbar-h); background: var(--night); display: flex; align-items: center; gap: 14px; padding: 0 24px; position: sticky; top: 0; z-index: 30; box-shadow: var(--shadow-md); }
    .tb-right { margin-left: auto; display: flex; gap: 8px; align-items: center; min-width: 0; }
    .user { display: flex; align-items: center; gap: 10px; padding-right: 8px; min-width: 0; }
    .user-txt { min-width: 0; text-align: right; }
    .user-n { font-size: 13px; color: #fff; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
    .user-g { font-size: 11px; color: #7c8aa3; white-space: nowrap; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--green); color: #fff; font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .page { padding: 24px; max-width: 1240px; margin: 0 auto; }
    .h-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .h-row h2 { font-size: 20px; font-weight: 600; }
    .h-row p { color: var(--text-muted); font-size: 13px; margin-top: 3px; }
    .h-row .acoes { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ── Botões ── */
    .btn { border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); border-radius: var(--radius); padding: 8px 14px; font-weight: 500; font-size: 13px; display: inline-flex; gap: 8px; align-items: center; transition: var(--t); white-space: nowrap; }
    .btn:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
    .btn.pri { background: var(--cyan); border-color: var(--cyan); color: #fff; }
    .btn.pri:hover:not(:disabled) { background: var(--cyan-hover); color: #fff; }
    .btn:disabled { opacity: .5; }
    .icon-btn { width: 36px; height: 36px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 14px; transition: var(--t); flex-shrink: 0; }
    .icon-btn:hover { color: var(--cyan); border-color: var(--cyan); }
    .topbar .icon-btn { background: transparent; border-color: rgba(255, 255, 255, .12); color: #b3c0d6; }
    .topbar .icon-btn:hover { border-color: var(--cyan); color: #fff; background: var(--cyan-light); }

    /* ── Cartão, busca e tabela ── */
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
    .toolbar { display: flex; gap: 10px; padding: 14px 18px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); }
    .search { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 9px; border: 1px solid var(--border); border-radius: var(--radius); padding: 0 12px; background: var(--bg-soft); color: var(--text-muted); height: 44px; }
    .search:focus-within { border-color: var(--cyan); }
    .search input { border: 0; background: transparent; outline: none; color: var(--text-primary); width: 100%; }
    .search .limpar { border: 0; background: none; color: var(--text-muted); width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; }
    .search .limpar:hover { background: var(--border); color: var(--text-primary); }
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--bg-card); }
    th:first-child, td:first-child { padding-left: 18px; }
    th:last-child, td:last-child { padding-right: 18px; }
    td { padding: 10px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tr.row { cursor: pointer; }
    tr.row:hover td { background: var(--bg-soft); }
    td.num, th.num { text-align: right; font-family: "DM Mono", monospace; }
    td.num b { font-weight: 500; font-size: 13px; }
    .mn { font-family: "DM Mono", monospace; font-weight: 500; color: var(--cyan); }
    td.desc { width: 100%; max-width: 0; min-width: 130px; }
    td.desc .nome { overflow: hidden; text-overflow: ellipsis; font-weight: 500; font-size: 13px; }
    td.desc .sub-m { display: none; font-size: 11.5px; color: var(--text-muted); margin-top: 3px; white-space: normal; }
    td.ic { color: var(--text-muted); text-align: right; }
    td.ic i { margin-left: 8px; font-size: 12px; }
    td.ic .fa-chevron-right { font-size: 10px; opacity: .6; }
    .neg { color: var(--green); font-size: 11px; margin-left: 7px; }
    th.ord { cursor: pointer; user-select: none; }
    th.ord i { font-size: 9px; opacity: .45; margin-left: 3px; }
    th.ord.on { color: var(--cyan); }
    th.ord.on i { opacity: 1; }
    .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 18px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); flex-wrap: wrap; }
    .pgs { display: flex; gap: 4px; align-items: center; }
    .pg { min-width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); font-size: 12px; padding: 0 8px; }
    .pg:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
    .pg.on { background: var(--cyan); border-color: var(--cyan); color: #fff; }
    .pg:disabled { opacity: .4; }
    .pg-gap { color: var(--text-muted); padding: 0 2px; }
    .vazio { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; line-height: 1.6; white-space: normal; }
    .vazio > i { font-size: 30px; color: var(--cyan); margin-bottom: 10px; display: block; }
    .vazio b { color: var(--text-primary); }

    /* ── Etiquetas e chips ── */
    .tag { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; padding: 2px 8px; border-radius: 5px; background: var(--bg-soft); color: var(--text-secondary); border: 1px solid var(--border); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    .tag i { font-size: 10px; }
    .badge-s { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
    .badge-s.ok { background: var(--green-bg); color: var(--green); }
    .po-ic { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); flex-shrink: 0; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 18px 0; }
    .chip { border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; transition: var(--t); }
    .chip:hover { border-color: var(--cyan); }
    .chip.on { border-color: var(--cyan); background: var(--cyan-light); color: var(--cyan); }

    /* ── Seletores em popover (substituem <select>) ── */
    .pop-wrap { position: relative; display: inline-block; }
    .pop-wrap.block { display: block; }
    .pop-wrap.open { z-index: 56; }
    .pop-btn { display: flex; align-items: center; gap: 10px; min-width: 180px; width: 100%; padding: 6px 12px 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); color: var(--text-primary); text-align: left; transition: var(--t); }
    .pop-btn:hover { border-color: var(--border-hover); }
    .pop-wrap.open .pop-btn { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-light); }
    .pop-btn.set { border-color: var(--cyan); background: var(--cyan-light); }
    .pb-ic { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: var(--bg-soft); color: var(--text-secondary); flex-shrink: 0; }
    .pop-btn.set .pb-ic { background: var(--cyan); color: #fff; }
    .pb-txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .pb-l { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); font-weight: 600; }
    .pb-v { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pb-chev { font-size: 10px; color: var(--text-muted); transition: transform .2s; }
    .pop-wrap.open .pb-chev { transform: rotate(180deg); color: var(--cyan); }
    .pb-clear { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--cyan); }
    .pb-clear:hover { background: var(--cyan); color: #fff; }
    .pop { position: absolute; top: calc(100% + 8px); left: 0; width: 320px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top left; pointer-events: none; transition: opacity .16s ease, transform .16s ease; overflow: hidden; outline: none; }
    .pop.right { left: auto; right: 0; transform-origin: top right; }
    .pop.up { top: auto; bottom: calc(100% + 8px); transform: translateY(6px) scale(.98); transform-origin: bottom left; }
    .pop-wrap.open .pop { opacity: 1; transform: none; pointer-events: auto; }
    .pop-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
    .pop-head span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--text-muted); }
    .pop-x { border: 0; background: none; color: var(--text-muted); width: 24px; height: 24px; border-radius: 6px; }
    .pop-x:hover { background: var(--bg-soft); color: var(--text-primary); }
    .pop-search { margin: 0 10px 6px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-soft); color: var(--text-muted); font-size: 12px; }
    .pop-search:focus-within { border-color: var(--cyan); }
    .pop-search input { border: 0; outline: none; background: transparent; padding: 8px 0; width: 100%; color: var(--text-primary); font-size: 13px; }
    .pop-list { max-height: 300px; overflow-y: auto; padding: 4px 6px 8px; position: relative; }
    .pop-opt { display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: var(--radius); text-align: left; color: var(--text-primary); transition: background .12s; }
    .pop-opt:hover, .pop-opt.hi { background: var(--bg-soft); }
    .po-txt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .po-l { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .po-d { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
    .po-n { font-family: "DM Mono", monospace; font-size: 11px; color: var(--text-muted); background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; }
    .po-ck { font-size: 12px; color: var(--cyan); width: 14px; opacity: 0; }
    .pop-opt.sel .po-l { font-weight: 600; }
    .pop-opt.sel .po-ck { opacity: 1; }
    .pop-empty { padding: 22px 10px; text-align: center; color: var(--text-muted); font-size: 12.5px; }
    .pop-empty i { display: block; font-size: 20px; margin-bottom: 8px; opacity: .6; }
    .pop-foot { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); }
    .pop-foot kbd { font-family: "DM Mono", monospace; font-size: 10px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--bg-soft); }
    .pop-foot button { border: 0; background: none; color: var(--cyan); font-size: 12px; font-weight: 600; }

    /* ── Gaveta lateral (detalhes do exame) ── */
    .backdrop { position: fixed; inset: 0; background: rgba(14, 22, 40, .45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 500px; max-width: 100%; background: var(--bg-card); z-index: 70; transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
    .drawer.open { transform: none; }
    .dr-h { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
    .dr-h .mn { font-size: 13px; }
    .dr-h h3 { font-size: 16px; font-weight: 600; margin-top: 4px; line-height: 1.3; }
    .dr-h .meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .dr-h .meta:empty { display: none; }
    .dr-b { flex: 1; overflow-y: auto; padding: 18px 22px; }
    .dr-f { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .sec-t { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin: 20px 0 10px; display: flex; gap: 7px; align-items: center; }
    .valor-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-soft); }
    .valor-box .l { font-size: 12px; color: var(--text-muted); }
    .valor-box .v { font-family: "DM Mono", monospace; font-size: 22px; font-weight: 500; letter-spacing: -.02em; margin-top: 2px; }
    .ins-txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.6; color: var(--text-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
    .secs { display: flex; flex-direction: column; gap: 10px; }

    .sec-h b { flex: 1; font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .sec-ic { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; background: var(--c); }
    .sec-cp { width: 28px; height: 28px; border: 0; border-radius: 7px; background: none; color: var(--text-muted); font-size: 12.5px; transition: var(--t); }
    .sec-cp:hover { color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
    .sec-b { padding: 11px 14px 12px; font-size: 13px; line-height: 1.6; color: var(--text-secondary); overflow-wrap: anywhere; }

    .sec-b li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
    /* campo longo abre recolhido: "Ver mais" mostra o restante */
    .sec.corta:not(.aberta) .sec-tx { max-height: 64px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 45%, transparent); mask-image: linear-gradient(#000 45%, transparent); }
    .sec-mais { display: none; width: 100%; border: 0; border-top: 1px solid var(--border); background: none; padding: 7px 14px; font-size: 12px; font-weight: 600; color: var(--c); gap: 6px; align-items: center; justify-content: center; transition: var(--t); }
    .sec.corta .sec-mais { display: flex; }

    .sec.aberta .sec-mais i { transform: rotate(180deg); }
    .anexos { display: flex; flex-direction: column; gap: 6px; }
    .anexo { display: flex; gap: 11px; align-items: center; padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-primary); text-decoration: none; transition: var(--t); }
    .anexo:hover { border-color: var(--cyan); background: var(--cyan-light); }

    .anexo > i { color: var(--text-muted); font-size: 12px; }
    .anexo:hover > i { color: var(--cyan); }

    /* ── Janela (texto da proposta) e toast ── */
    .modal { position: fixed; inset: 0; background: rgba(14, 22, 40, .5); z-index: 150; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal.open { display: flex; }
    .modal-card { background: var(--bg-card); border-radius: 14px; padding: 24px; width: 100%; max-width: 680px; box-shadow: var(--shadow-lg); animation: surgir .16s ease; max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
    .modal-card h3 { font-size: 16px; margin-bottom: 4px; }
    .modal-card p { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 14px; }

    @keyframes surgir { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(90px); background: var(--night); color: #fff; padding: 11px 18px; border-radius: var(--radius); font-size: 13px; box-shadow: var(--shadow-lg); transition: transform .25s; z-index: 200; display: flex; gap: 9px; align-items: center; max-width: calc(100% - 32px); }
    .toast i { color: var(--cyan); }
    .toast.erro i { color: #ff6b76; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Convite para instalar o aplicativo ── */
    .install-banner { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 420px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 12px 14px; display: none; gap: 10px; align-items: center; z-index: 50; font-size: 12.5px; }
    .install-banner.show { display: flex; }
    .install-banner p { flex: 1; }

    /* ── Celular ── */
    @media (max-width: 768px) {
      .page { padding: 16px; }
      .topbar { padding: 0 16px; }
      .user-txt { display: none; }
      .drawer { width: 100%; }
      .toolbar .pop-wrap { flex: 1 1 140px; }
      .pop-btn { min-width: 0; }
      /* painel vira bottom sheet; a sombra larga escurece o fundo */
      .pop, .pop.right, .pop.up, .auth .pop { position: fixed; left: 0; right: 0; top: auto; bottom: 0; width: 100%; border-radius: 16px 16px 0 0; transform: translateY(100%); transition: transform .22s ease, opacity .1s; }
      .pop-wrap.open .pop { box-shadow: 0 0 0 100vmax rgba(14, 22, 40, .45); }
      .pop::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 8px auto 0; }
      .pop-list { max-height: 55vh; }
      .pop-foot .keys { display: none; }
      .col-mn, .col-mat, .col-prazo { display: none; }
      .col-mn + th, .col-mn + td { padding-left: 16px; }
      td.desc .nome { white-space: normal; }
      td.desc .sub-m { display: block; }
      td.ic .fa-chevron-right { display: none; }
    }
    @media (max-width: 420px) {
      .brand-sub { display: none; }
      .auth-card { padding: 26px 22px; }
    }

<body>

  <!-- Tela de acesso -->
  <div class="auth" id="auth"></div>

  <!-- Aplicação -->
  <div class="oculto" id="app">

  <!-- Gaveta lateral -->
  <div class="backdrop" id="gaveta-fundo" onclick="fecharGaveta()"></div>
  <aside class="drawer" id="gaveta" aria-label="Detalhes do exame">
    <div class="dr-h">

  <div class="modal" id="modal"></div>
  <div class="toast" id="toast"></div>

  <div id="install-banner" class="install-banner">
    <span class="po-ic" style="--c:var(--cyan)"><i class="fa-solid fa-mobile-screen"></i></span>
    <p>Instale o aplicativo para acessar a tabela mais rápido.</p>
    <button class="btn pri" id="install-app-button">Instalar</button>
    <button class="icon-btn close-install" title="Agora não"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <!-- Firebase (compat) — mesmo banco do COMERCIAL LAMIC -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // LAMIC Apoiados (L2L) — tabela de exames do laboratório apoiado.
    // Tudo vem do banco do COMERCIAL LAMIC (nada é gravado, exceto a
    // data do último acesso):
    //   l2l/acessos            lista do login e conferência da senha
    //                          (cadastro em Comercial → Configurações → Apoiados)
    //   laboratorios/{id}      nome, ativo, tabelaId e precos (valores diferenciados)
    //   tabelas/{tabelaId}     nome e precos (valor padrão de cada exame)
    //   exames                 mn, descricao, ativo, material e prazo
    //   catalogo               nome, material, prazo, instrução e anexos
    // ═══════════════════════════════════════════════════════════════

    const firebaseConfig = {
      apiKey: 'AIzaSyBD7XDmLJoc-_0Kb_53emSK7AHRl9W3C_s',
      authDomain: 'precificacao-73fc3.firebaseapp.com',
      databaseURL: 'https://precificacao-73fc3-default-rtdb.firebaseio.com',
      projectId: 'precificacao-73fc3',
      storageBucket: 'precificacao-73fc3.firebasestorage.app',
      messagingSenderId: '432300497351',
      appId: '1:432300497351:web:4d23dac46edd141724e1e2'
    };
    firebase.initializeApp(firebaseConfig);
    const _db = firebase.database();
    const DB = {
      ler: async caminho => (await _db.ref(caminho).get()).val(),
      gravar: (caminho, valor) => _db.ref(caminho).set(valor),
      ouvir: (caminho, cb) => _db.ref(caminho).on('value', s => cb(s.val())),
      agora: () => firebase.database.ServerValue.TIMESTAMP
    };

    // ── Funções auxiliares ────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const fmt = v => v == null || isNaN(v) ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const semAcento = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
    // Busca: ignora acentos, pontuação e espaços ("vit. b-12" acha "VITAMINA B12")
    const soLetras = s => semAcento(s).replace(/[^a-z0-9]/g, '');
    const contem = (texto, busca) => !busca || semAcento(texto).includes(semAcento(busca));
    const iniciais = nome => String(nome || '?').replace(/^lab(orat[oó]rio)?\.?\s+/i, '').trim().split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
    const CORES_AVATAR = ['#2a9d8f', '#e8913a', '#6366f1', '#00a8cc', '#ec4899', '#0e7490', '#8b5cf6', '#16a34a'];
    const corAvatar = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return CORES_AVATAR[h % CORES_AVATAR.length]; };
    // Prazo de liberação em dias → texto (0 = 24 Horas)
    const prazoTexto = dias => dias == null || dias === '' || isNaN(dias) ? '' : +dias <= 0 ? '24 Horas' : +dias === 1 ? '1 dia' : `${+dias} dias`;
    // Texto antigo: "24 H" → 0 · "48h" → 2 · "4 Dias" → 4 · "N/A" → null
    function diasDoTexto(t) {
      let m = String(t || '').match(/(\d+)\s*h/i);
      if (m) return +m[1] <= 24 ? 0 : Math.ceil(+m[1] / 24);
      m = String(t || '').match(/(\d+)\s*d/i);
      return m ? +m[1] : null;
    }
    const vazio = (icone, texto) => `<div class="vazio"><i class="fa-solid ${icone}"></i><p>${texto}</p></div>`;

    // SHA-256 em JS puro (igual ao login do Comercial; funciona também fora de HTTPS)
    const _K256 = [
      0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
      0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
      0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
      0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
      0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
      0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
      0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
      0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
    ];
    function sha256(texto) {
      const bytes = new TextEncoder().encode(texto), l = bytes.length;
      const blocos = (l + 9 + 63) >> 6, w = new Uint32Array(blocos * 16);
      for (let i = 0; i < l; i++) w[i >> 2] |= bytes[i] << (24 - (i % 4) * 8);
      w[l >> 2] |= 0x80 << (24 - (l % 4) * 8);
      w[blocos * 16 - 1] = (l * 8) >>> 0;
      w[blocos * 16 - 2] = Math.floor(l * 8 / 0x100000000);
      const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
      const W = new Uint32Array(64);
      const rotr = (x, n) => (x >>> n) | (x << (32 - n));
      for (let b = 0; b < blocos; b++) {
        for (let t = 0; t < 16; t++) W[t] = w[b * 16 + t];
        for (let t = 16; t < 64; t++) {
          const s0 = rotr(W[t - 15], 7) ^ rotr(W[t - 15], 18) ^ (W[t - 15] >>> 3);
          const s1 = rotr(W[t - 2], 17) ^ rotr(W[t - 2], 19) ^ (W[t - 2] >>> 10);
          W[t] = (W[t - 16] + s0 + W[t - 7] + s1) >>> 0;
        }
        let [a, bb, c, d, e, f, g, h] = H;
        for (let t = 0; t < 64; t++) {
          const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + _K256[t] + W[t]) >>> 0;
          const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) >>> 0;
          h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = bb; bb = a; a = (t1 + t2) >>> 0;
        }
        [a, bb, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });
      }
      return H.map(x => x.toString(16).padStart(8, '0')).join('');
    }
    const hashSenha = (senha, sal) => sha256(sal + ':' + senha);

    // ── Toast ─────────────────────────────────────────────────────
    let _toastTimer = null;
    function toast(texto, tipo = 'ok') {
      const el = $('toast');
      el.className = 'toast ' + tipo;
      el.innerHTML = `<i class="fa-solid ${tipo === 'erro' ? 'fa-circle-xmark' : 'fa-circle-check'}"></i><span>${esc(texto)}</span>`;
      requestAnimationFrame(() => el.classList.add('show'));
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
    }

    // ── Gaveta lateral ────────────────────────────────────────────
    function abrirGaveta({ sobre = '', titulo = '', meta = '', corpo = '', rodape = '' }) {
      fecharPop();
      $('g-sobre').textContent = sobre;
      $('g-titulo').textContent = titulo;
      $('g-meta').innerHTML = meta;
      const c = $('g-corpo');
      c.innerHTML = corpo; c.scrollTop = 0;
      $('g-rodape').innerHTML = rodape;
      $('gaveta').classList.add('open');
      $('gaveta-fundo').classList.add('open');
    }
    function fecharGaveta() {
      $('gaveta').classList.remove('open');
      $('gaveta-fundo').classList.remove('open');
    }

    // ── Popover (substitui <select>) ──────────────────────────────
    // criarPop('id-do-container', { rotulo, titulo, icone, padrao, busca, limpavel, semValor,
    //   opcoes: [{ valor, rotulo, icone, cor, desc, qtd }] | () => [...], aoMudar })
    const POPS = {};
    let popAberto = null;
    function criarPop(id, cfg) {
      const wrap = $(id);
      if (!wrap) return null;
      const st = Object.assign({ valor: cfg.padrao ?? '' }, cfg, { id, wrap });
      if (POPS[id]) st.valor = POPS[id].valor;           // mantém a escolha ao recriar
      POPS[id] = st;
      wrap.classList.add('pop-wrap');
      wrap.innerHTML = `<button type="button" class="pop-btn" aria-haspopup="listbox" aria-expanded="false"></button><div class="pop" role="listbox" tabindex="-1"></div>`;
      st.btn = wrap.querySelector('.pop-btn');
      st.painel = wrap.querySelector('.pop');
      st.btn.onclick = () => popAberto === id ? fecharPop() : abrirPop(id);
      desenharBotaoPop(id);
      return st;
    }
    const opcoesPop = st => typeof st.opcoes === 'function' ? st.opcoes() : st.opcoes;
    const valorPop = id => POPS[id]?.valor ?? '';
    function desenharBotaoPop(id) {
      const st = POPS[id], o = opcoesPop(st).find(x => x.valor === st.valor);
      const marcado = !!o && st.valor !== (st.padrao ?? '');
      st.btn.classList.toggle('set', marcado && !!st.limpavel);
      st.btn.innerHTML = `<span class="pb-ic"><i class="fa-solid ${marcado && o.icone ? o.icone : st.icone}"></i></span>
        <span class="pb-txt"><span class="pb-l">${esc(st.rotulo)}</span><span class="pb-v">${esc(o ? o.rotulo : st.semValor || '—')}</span></span>
        ${marcado && st.limpavel ? `<span class="pb-clear" title="Limpar" onclick="event.stopPropagation();definirPop('${id}','${esc(st.padrao ?? '')}')"><i class="fa-solid fa-xmark"></i></span>` : ''}
        <i class="fa-solid fa-chevron-down pb-chev"></i>`;
    }
    function abrirPop(id) {
      fecharPop();
      const st = POPS[id];
      popAberto = id; st.q = '';
      st.wrap.classList.add('open');
      st.btn.setAttribute('aria-expanded', 'true');
      st.painel.classList.toggle('right', st.wrap.getBoundingClientRect().left + 330 > window.innerWidth);
      desenharPainelPop(id);
      const wr = st.wrap.getBoundingClientRect(), ph = st.painel.offsetHeight;
      st.painel.classList.toggle('up', wr.bottom + ph + 12 > window.innerHeight && wr.top > window.innerHeight - wr.bottom);
      st.hi = Math.max(0, st.vis.findIndex(o => o.valor === st.valor));
      desenharListaPop(id);
      const busca = st.painel.querySelector('.pop-search input');
      (busca && window.innerWidth > 768 ? busca : st.painel).focus({ preventScroll: true });
    }
    function fecharPop() {
      if (!popAberto) return;
      const st = POPS[popAberto];
      if (st) { st.wrap.classList.remove('open'); st.btn.setAttribute('aria-expanded', 'false'); }
      popAberto = null;
    }
    function desenharPainelPop(id) {
      const st = POPS[id];
      st.painel.innerHTML = `
        <div class="pop-head"><span>${esc(st.titulo || st.rotulo)}</span><button type="button" class="pop-x" onclick="fecharPop()"><i class="fa-solid fa-xmark"></i></button></div>
        ${st.busca ? `<div class="pop-search"><i class="fa-solid fa-magnifying-glass"></i><input placeholder="${esc(st.busca)}" oninput="POPS['${id}'].q=this.value;POPS['${id}'].hi=0;desenharListaPop('${id}')"></div>` : ''}
        <div class="pop-list"></div>
        <div class="pop-foot"><span class="keys"><kbd>↑↓</kbd> navegar · <kbd>Enter</kbd> · <kbd>Esc</kbd></span>
          ${st.limpavel ? `<button type="button" onclick="definirPop('${id}','${esc(st.padrao ?? '')}')"><i class="fa-solid fa-rotate-left"></i> Limpar</button>` : ''}</div>`;
      desenharListaPop(id);
    }
    function desenharListaPop(id) {
      const st = POPS[id];
      st.vis = opcoesPop(st).filter(o => contem(o.rotulo + ' ' + (o.desc || ''), st.q));
      st.painel.querySelector('.pop-list').innerHTML = st.vis.map((o, i) => {
        const sel = o.valor === st.valor;
        return `<button type="button" class="pop-opt ${sel ? 'sel' : ''} ${i === st.hi ? 'hi' : ''}" role="option" aria-selected="${sel}"
            onmouseenter="POPS['${id}'].hi=${i};marcarPop('${id}')" onclick="escolherPop('${id}',${i})">
          <span class="po-ic" style="--c:${o.cor || 'var(--cyan)'}"><i class="fa-solid ${o.icone || 'fa-circle'}"></i></span>
          <span class="po-txt"><span class="po-l">${esc(o.rotulo)}</span>${o.desc ? `<span class="po-d">${esc(o.desc)}</span>` : ''}</span>
          ${o.qtd != null ? `<span class="po-n">${o.qtd}</span>` : ''}<i class="fa-solid fa-check po-ck"></i></button>`;
      }).join('') || `<div class="pop-empty"><i class="fa-solid fa-magnifying-glass"></i>Nada encontrado</div>`;
    }
    function marcarPop(id) {
      const st = POPS[id], itens = st.painel.querySelectorAll('.pop-opt'), lst = st.painel.querySelector('.pop-list');
      itens.forEach((b, i) => b.classList.toggle('hi', i === st.hi));
      const el = itens[st.hi];
      if (!el) return;
      // rola só a lista, nunca a página
      if (el.offsetTop < lst.scrollTop) lst.scrollTop = el.offsetTop - 6;
      else if (el.offsetTop + el.offsetHeight > lst.scrollTop + lst.clientHeight) lst.scrollTop = el.offsetTop + el.offsetHeight - lst.clientHeight + 6;
    }
    function escolherPop(id, i) { definirPop(id, POPS[id].vis[i].valor); }
    function definirPop(id, valor) {
      const st = POPS[id];
      st.valor = valor;
      desenharBotaoPop(id);
      fecharPop();
      st.aoMudar?.(valor);
    }
    document.addEventListener('keydown', e => {
      if (popAberto) {
        const st = POPS[popAberto];
        if (e.key === 'Escape') { fecharPop(); st.btn.focus(); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); st.hi = Math.min(st.vis.length - 1, st.hi + 1); marcarPop(popAberto); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); st.hi = Math.max(0, st.hi - 1); marcarPop(popAberto); }
        else if (e.key === 'Enter') { e.preventDefault(); if (st.vis[st.hi]) escolherPop(popAberto, st.hi); }
        return;
      }
      if (e.key !== 'Escape') return;
      if ($('modal').classList.contains('open')) fecharModal();
      else fecharGaveta();
    });
    // clique fora fecha o popover
    document.addEventListener('pointerdown', e => { if (popAberto && !POPS[popAberto].wrap.contains(e.target)) fecharPop(); });

    // ── Modo noturno ──────────────────────────────────────────────
    function aplicarTema(escuro) {
      document.documentElement.dataset.theme = escuro ? 'dark' : 'light';
      $('bt-tema').innerHTML = `<i class="fa-solid ${escuro ? 'fa-sun' : 'fa-moon'}"></i>`;
      $('bt-tema').title = escuro ? 'Modo claro' : 'Modo noturno';

    }
    function alternarTema() { aplicarTema(document.documentElement.dataset.theme !== 'dark'); }
    function temaInicial() {
      let t = null;
      try { t = localStorage.getItem('l2l-tema'); } catch (e) {}
      aplicarTema(t === 'dark');   // claro por padrão; lembra a escolha do usuário
    }

    // ── Acesso ────────────────────────────────────────────────────
    const SESSAO_KEY = 'l2l-sessao-v1', SESSAO_DIAS = 30;
    let ACESSOS = {};            // l2l/acessos
    let acesso = null;           // { id, nome, interno, m } de quem entrou (m = marca da senha no login)
    let tentativas = 0, bloqueado = false;

    const acessosLogin = () => Object.entries(ACESSOS).filter(([, a]) => a && a.hash && a.ativo !== false).map(([id, a]) => ({ id, ...a }))
      .sort((a, b) => (b.interno ? 1 : 0) - (a.interno ? 1 : 0) || String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
    const marcaSessao = a => String(a.hash).slice(0, 16);   // senha redefinida no Comercial derruba a sessão
    const acessoVale = (id, m) => { const a = ACESSOS[id]; return !!a && !!a.hash && a.ativo !== false && marcaSessao(a) === m; };

    function salvarSessao(id) {
      try {
        localStorage.setItem(SESSAO_KEY, JSON.stringify({ id, m: marcaSessao(ACESSOS[id]), em: Date.now() }));
        localStorage.setItem('l2l-ultimo', id);
      } catch (e) {}
    }
    function sessaoValida() {
      try {
        const s = JSON.parse(localStorage.getItem(SESSAO_KEY) || 'null');
        return s && acessoVale(s.id, s.m) && Date.now() - s.em < SESSAO_DIAS * 864e5 ? s.id : null;
      } catch (e) { return null; }
    }
    function encerrarSessao() {
      acesso = null;
      try { localStorage.removeItem(SESSAO_KEY); } catch (e) {}
    }

    function mostrarAuth(modo, msg = '') {
      fecharPop(); fecharGaveta(); fecharModal();
      $('app').classList.add('oculto');
      const el = $('auth');
      el.classList.remove('hide');
      const marca = `<div class="brand"><div class="brand-ico"><i class="fa-solid fa-flask-vial"></i></div>
        <div><div class="brand-name">LAMIC APOIADOS</div><div class="brand-sub">Tabela Lamic-to-Lab</div></div></div>`;
      let corpo;
      if (modo === 'carregando') {
        corpo = `<div class="auth-load"><i class="fa-solid fa-circle-notch fa-spin"></i>${esc(msg || 'Conectando…')}</div>`;
      } else if (modo === 'erro-conexao') {
        corpo = `<h1>Sem conexão</h1><p>Não foi possível acessar a tabela de exames. Verifique a internet e tente de novo.</p>
          <button class="btn-primary" onclick="location.reload()"><i class="fa-solid fa-rotate"></i>Tentar novamente</button>`;
      } else if (!acessosLogin().length) {
        corpo = `<h1>Acesso indisponível</h1><p>Nenhum laboratório com acesso liberado. Fale com o Laboratório LAMIC.</p>`;
      } else {
        corpo = `<h1>Bem-vindo</h1><p>Escolha o seu laboratório e informe a senha de acesso.</p>
          <div class="auth-erro" id="l-erro">${msg ? `<i class="fa-solid fa-circle-exclamation"></i>${esc(msg)}` : ''}</div>
          <form onsubmit="event.preventDefault();entrar()">
            <label>Laboratório</label><div id="pop-lab" class="block"></div>
            <label for="l-senha">Senha</label>
            <div class="inp-auth"><i class="fa-solid fa-lock"></i><input id="l-senha" type="password" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="ver-senha" title="Mostrar a senha" onclick="verSenha(this)"><i class="fa-solid fa-eye"></i></button></div>
            <button class="btn-primary" type="submit" id="l-entrar"><i class="fa-solid fa-right-to-bracket"></i>Entrar</button>
          </form>
          <div class="auth-espera" id="l-espera">Muitas tentativas. Aguarde para tentar novamente.<div class="barra"><div id="l-barra"></div></div></div>
          <div class="auth-rodape">Esqueceu a senha? Fale com o Laboratório LAMIC.</div>`;
      }
      el.innerHTML = `<div class="auth-card" id="auth-card">${marca}${corpo}</div>`;
      if (!$('pop-lab')) return;
      criarPop('pop-lab', {
        rotulo: 'Laboratório', titulo: 'Escolha o laboratório', icone: 'fa-building-user', semValor: 'Selecione…', busca: 'Buscar laboratório…', padrao: '',
        opcoes: () => acessosLogin().map(a => ({ valor: a.id, rotulo: a.nome, icone: a.interno ? 'fa-hospital' : 'fa-building-user', cor: a.interno ? 'var(--cyan)' : corAvatar(a.id) })),
        aoMudar: () => { erroLogin(''); $('l-senha')?.focus(); }
      });
      let ultimo = '';
      try { ultimo = localStorage.getItem('l2l-ultimo') || ''; } catch (e) {}
      if (!acessosLogin().some(a => a.id === POPS['pop-lab'].valor)) POPS['pop-lab'].valor = acessosLogin().some(a => a.id === ultimo) ? ultimo : '';
      desenharBotaoPop('pop-lab');
      if (bloqueado) travarLogin(true);
      else if (POPS['pop-lab'].valor) $('l-senha').focus();
    }

    function verSenha(b) {
      const inp = $('l-senha'), ver = inp.type === 'password';
      inp.type = ver ? 'text' : 'password';
      b.innerHTML = `<i class="fa-solid ${ver ? 'fa-eye-slash' : 'fa-eye'}"></i>`;
    }
    function erroLogin(msg) {
      const el = $('l-erro');
      if (el) el.innerHTML = msg ? `<i class="fa-solid fa-circle-exclamation"></i>${esc(msg)}` : '';
    }
    function travarLogin(travar) {
      ['l-senha', 'l-entrar'].forEach(id => { if ($(id)) $(id).disabled = travar; });
      if ($('l-espera')) $('l-espera').style.display = travar ? 'block' : 'none';
    }
    // 5 senhas erradas → espera de 10 segundos
    function falhaLogin() {
      tentativas++;
      const card = $('auth-card');
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 500);
      erroLogin('Senha incorreta.');
      $('l-senha').select();
      if (tentativas < 5) return;
      bloqueado = true;
      travarLogin(true);
      const total = 10;
      let resta = total;
      const passo = () => {
        if ($('l-barra')) $('l-barra').style.width = `${(total - resta) / total * 100}%`;
        if (resta-- > 0) return setTimeout(passo, 1000);
        bloqueado = false;
        travarLogin(false); erroLogin('');
        if ($('l-barra')) $('l-barra').style.width = '0';
        $('l-senha')?.focus();
      };
      passo();
    }

    function entrar() {
      if (bloqueado) return;
      const id = valorPop('pop-lab'), senha = $('l-senha').value.trim(), a = ACESSOS[id];
      if (!id) return erroLogin('Escolha o laboratório.');
      if (!senha) return erroLogin('Informe a senha.');
      if (!a || !a.hash || hashSenha(senha, a.sal) !== a.hash) return falhaLogin();
      if (a.ativo === false) return erroLogin('Acesso bloqueado. Fale com o Laboratório LAMIC.');
      tentativas = 0;
      salvarSessao(id);
      abrirApp(id);
    }

    function sair(msg = '') {
      encerrarSessao();
      mostrarAuth('login', msg);
    }

    // ── Dados ─────────────────────────────────────────────────────
    const DADOS = { linhas: [], tabela: '', em: null };
    const erroL2L = msg => Object.assign(new Error(msg), { l2l: true });
    const anexosDe = r => Object.values(r?.anexos || {}).filter(a => a && /^https?:\/\/\S+$/i.test(String(a.url || '').trim())).map(a => ({ nome: String(a.nome || 'Anexo'), url: String(a.url).trim() }));
    // Instrução é texto puro: marcação antiga (<a href>…</a>) sai, fica só o texto
    const textoLimpo = t => String(t || '').replace(/<\/?[a-z][^>]*>/gi, '').replace(/\n{3,}/g, '\n\n').trim();

    // ── Instrução em campos por categoria ─────────────────────────
    // O Comercial grava catalogo/{chave}/secoes; exame ainda não migrado traz só o texto
    // corrido (instrucao), separado aqui pelos títulos. Mesma regra de script/secoes.js
    // do Comercial: manter as duas cópias iguais.
    const SECOES = {
      jejum:        { nome: 'Jejum',                icone: 'fa-utensils',             cor: '#e8890c', re: /^(tempo de )?jejum( obrigatorio)?$/ },
      orientacoes:  { nome: 'Orientações',          icone: 'fa-clipboard-list',       cor: '#00a8cc', re: /^(orientacao|orientacoes|preparo|instrucoes( de (preparo|coleta))?|informacoes de preparo e coleta)$/ },
      questionario: { nome: 'Questionário',         icone: 'fa-clipboard-question',   cor: '#6366f1', re: /^questionarios?$/ },
      interacoes:   { nome: 'Interações',           icone: 'fa-triangle-exclamation', cor: '#d97706', re: /^((interacao|interacoes)( medicamentosas?)?|interferentes)$/ },
      rejeicao:     { nome: 'Critério de rejeição', icone: 'fa-ban',                  cor: '#e63946', re: /^(criterios? de )?rejeicao$/ },
      conservacao:  { nome: 'Conservação',          icone: 'fa-temperature-low',      cor: '#0ea5e9', re: /^(conservacao|armazenamento|estabilidade)$/ },
      coleta:       { nome: 'Coleta',               icone: 'fa-syringe',              cor: '#16a34a', re: /^coleta( (no )?apoio)?$/ },
      sobre:        { nome: 'Sobre o exame',        icone: 'fa-magnifying-glass',     cor: '#64748b', re: /^(sobre( o exame)?|fundamentacao teorica|interpretacao do exame)$/ },
      comentarios:  { nome: 'Comentários',          icone: 'fa-comment-dots',         cor: '#8b5cf6', re: /^(comentarios?|cometarios?)$/ }
    };
    const RE_EMOJI = /[\p{Extended_Pictographic}\uFE0F\u200D]/gu;
    function tituloSecao(linha) {
      const m = String(linha).trim().match(/^([^\p{L}\p{N}]*)([\p{L} ]{3,40}?)\s*(?::\s*(.*))?$/u);
      if (!m || (m[1] && !/\p{Extended_Pictographic}/u.test(m[1]))) return null;
      const t = m[2].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
      if (m[3] === undefined && /^jejum nao (e )?(necessario|obrigatorio)$/.test(t)) return { k: 'jejum', resto: m[2].trim() };
      const k = Object.keys(SECOES).find(s => SECOES[s].re.test(t));
      return k ? { k, resto: (m[3] || '').trim() } : null;
    }
    function limparSecoes(s) {
      const r = {};
      Object.keys(SECOES).forEach(k => {
        const t = textoLimpo(s?.[k]).replace(/[ \t]+$/gm, '').replace(/\n{3,}/g, '\n\n').replace(/(^|\n)[ \t]*(?:🔗[ \t]*)?anexos?[ \t]*:?[ \t]*$/i, '').trim();
        if (t) r[k] = t;
      });
      return r;
    }
    function separarSecoes(texto) {
      const partes = {};
      let atual = 'sobre';
      String(texto || '').replace(/\r\n?/g, '\n').split('\n').forEach(linha => {
        const t = tituloSecao(linha);
        if (t) { atual = t.k; (partes[atual] ??= []).push('', t.resto); }
        else (partes[atual] ??= []).push(linha);
      });
      return limparSecoes(Object.fromEntries(Object.entries(partes).map(([k, ls]) => [k, ls.join('\n')])));
    }
    const secoesDe = c => c?.secoes ? limparSecoes(c.secoes) : separarSecoes(textoLimpo(c?.instrucao));
    const semEmoji = t => String(t || '').replace(RE_EMOJI, '').replace(/^[ \t]+/gm, '').trim();
    // Texto do campo em parágrafos, listas (•, -, *) e subtítulos (linha curta terminada em ":")
    function htmlTextoSecao(texto) {
      const RE_ITEM = /^(?:[•\-–*]|=>|\.{1,4})\s+/;
      let html = '', lista = false;
      const fechar = () => { if (lista) { html += '</ul>'; lista = false; } };
      semEmoji(texto).split('\n').forEach(l => {
        const t = l.trim();
        if (!t) return fechar();
        if (RE_ITEM.test(t)) { if (!lista) { html += '<ul>'; lista = true; } html += `<li>${esc(t.replace(RE_ITEM, ''))}</li>`; return; }
        fechar();
        html += `<p${/:$/.test(t) && t.length < 70 ? ' class="sub"' : ''}>${esc(t)}</p>`;
      });
      fechar();
      return html;
    }
    async function copiarSecao(k) {
      const x = _aberto, t = x && x.secoes[k] ? `${SECOES[k].nome}:\n${semEmoji(x.secoes[k])}` : '';
      if (!t) return;
      try { await navigator.clipboard.writeText(t); toast(`${SECOES[k].nome} copiado`); } catch (e) { toast('Não foi possível copiar'); }
    }

    async function carregarDados(id) {
      const a = ACESSOS[id];
      if (!a) throw erroL2L('Acesso não encontrado. Fale com o Laboratório LAMIC.');
      const pExames = DB.ler('exames'), pCatalogo = DB.ler('catalogo');
      pExames.catch(() => {}); pCatalogo.catch(() => {});
      // 'lamic' não tem cadastro de laboratório; acesso interno usa a tabela base escolhida no Comercial
      let lab = null, tabelaId = a.tabelaId || null;
      if (id !== 'lamic') {
        lab = await DB.ler(`laboratorios/${id}`);
        if (!lab || lab.ativo === false) throw erroL2L('Laboratório inativo. Fale com o Laboratório LAMIC.');
        tabelaId = (a.interno && a.tabelaId) || lab.tabelaId || null;
      }
      let tabela = tabelaId ? await DB.ler(`tabelas/${tabelaId}`) : null;
      if (!tabela) {      // sem tabela definida: a tabela ativa de laboratórios apoiados
        const todas = Object.values(await DB.ler('tabelas') || {}).filter(t => t.tipo === 'lab');
        tabela = todas.sort((x, y) => (y.ativa !== false) - (x.ativa !== false) || (x.ordem ?? 99) - (y.ordem ?? 99))[0] || null;
      }
      const [exames, catalogo] = await Promise.all([pExames, pCatalogo]);
      const pTab = tabela?.precos || {}, pLab = a.interno ? {} : lab?.precos || {};   // interno: só a tabela base
      // valor diferenciado do laboratório vale no lugar do valor da tabela
      DADOS.linhas = [...new Set([...Object.keys(pTab), ...Object.keys(pLab)])].map(k => {
        const e = exames?.[k], c = catalogo?.[k] || {}, valor = pLab[k] ?? pTab[k];
        if (!e || e.ativo === false || !(valor >= 0)) return null;
        const d = c.prazoDias ?? e.prazoDias, dias = d != null && !isNaN(d) ? +d : diasDoTexto(c.prazo || e.prazo);
        const x = { k, mn: String(e.mn || c.mn || k), nome: String(c.nome || e.descricao || e.mn || k), material: String(c.material || e.material || ''),
          dias, prazo: prazoTexto(d) || String(c.prazo || e.prazo || ''), valor: +valor, neg: pLab[k] != null, secoes: secoesDe(c), anexos: anexosDe(c) };
        x.instrucao = Object.keys(x.secoes).length > 0;
        x.busca = soLetras(x.mn + x.nome + x.material);
        return x;
      }).filter(Boolean);
      DADOS.tabela = tabela?.nome || '';
      DADOS.em = new Date();
      acesso = { id, nome: lab?.nome || a.nome, interno: !!a.interno, m: marcaSessao(a) };
    }

    async function abrirApp(id) {
      mostrarAuth('carregando', 'Carregando a tabela de exames…');
      try { await carregarDados(id); }
      catch (e) {
        console.error(e);
        encerrarSessao();
        return mostrarAuth('login', e.l2l ? e.message : 'Não foi possível carregar a tabela. Verifique a internet e tente de novo.');
      }
      $('auth').classList.add('hide');
      $('app').classList.remove('oculto');
      Object.assign(F, { q: '', filtro: '', pag: 1, ordem: 'nome', dir: 1 });
      delete POPS['pop-mat']; delete POPS['pop-prazo'];
      $('user-box').innerHTML = `<div class="user-txt"><div class="user-n">${esc(acesso.nome)}</div><div class="user-g">${acesso.interno ? 'Acesso interno' : 'Laboratório apoiado'}</div></div>
        <div class="avatar" style="background:${corAvatar(acesso.id)}">${esc(iniciais(acesso.nome))}</div>`;
      desenharTela();
      window.scrollTo(0, 0);
      DB.gravar(`l2l/acessos/${id}/ultimoAcesso`, DB.agora()).catch(() => {});
    }

    async function atualizar(b) {
      b.disabled = true; b.querySelector('i').classList.add('fa-spin');
      try { await carregarDados(acesso.id); desenharTela(); toast('Tabela atualizada'); }
      catch (e) {
        if (e.l2l) return sair(e.message);
        b.disabled = false; b.querySelector('i').classList.remove('fa-spin');
        toast('Não foi possível atualizar. Verifique a internet.', 'erro');
      }
    }

    // ── Tela ──────────────────────────────────────────────────────
    const POR_PAG = 50;
    const F = { q: '', filtro: '', pag: 1, ordem: 'nome', dir: 1 };
    const FILTROS = {
      neg: { nome: 'Valores negociados', icone: 'fa-handshake', f: x => x.neg },
      ins: { nome: 'Com instrução', icone: 'fa-file-lines', f: x => x.instrucao },
      anx: { nome: 'Com anexos', icone: 'fa-paperclip', f: x => x.anexos.length }
    };
    const PRAZOS = {
      d0: { nome: '24 Horas', f: x => x.dias === 0 },
      d2: { nome: 'Até 2 dias', f: x => x.dias != null && x.dias <= 2 },
      d5: { nome: 'Até 5 dias', f: x => x.dias != null && x.dias <= 5 },
      d10: { nome: 'Até 10 dias', f: x => x.dias != null && x.dias <= 10 },
      dm: { nome: 'Mais de 10 dias', f: x => x.dias != null && x.dias > 10 },
      sem: { nome: 'Sem prazo informado', f: x => x.dias == null }
    };
    let _vis = [];              // linhas da página atual (a gaveta abre pelo índice)

    function desenharTela() {
      const hora = DADOS.em.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      $('page').innerHTML = `
        <div class="h-row"><div><h2>Tabela de exames</h2><p>Valores, prazos e instruções para <b>${esc(acesso.nome)}</b>${acesso.interno && DADOS.tabela ? ` · tabela ${esc(DADOS.tabela)}` : ''} · atualizado às ${hora}</p></div>
          <div class="acoes"><button class="btn" onclick="atualizar(this)"><i class="fa-solid fa-rotate"></i>Atualizar</button>
            ${acesso.interno ? `<button class="btn pri" onclick="abrirProposta()"><i class="fa-solid fa-file-pdf"></i>Baixar proposta</button>` : ''}</div></div>
        <div class="card">
          <div class="toolbar">
            <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" value="${esc(F.q)}" placeholder="Buscar exame, mnemônico ou material…" autocomplete="off" oninput="F.q=this.value;F.pag=1;desenharLista()">
              <button type="button" class="limpar" id="q-limpar" title="Limpar a busca" onclick="F.q='';F.pag=1;$('q').value='';desenharLista();$('q').focus()"><i class="fa-solid fa-xmark"></i></button></div>
            <div id="pop-mat"></div><div id="pop-prazo"></div>
          </div>
          <div class="chips" id="chips"></div>
          <div class="tbl-wrap" style="margin-top:10px"><table><thead id="cab"></thead><tbody id="corpo"></tbody></table></div>
          <div class="foot" id="rodape"></div>
        </div>`;
      const mats = {};
      DADOS.linhas.forEach(x => { if (x.material) mats[x.material] = (mats[x.material] || 0) + 1; });
      criarPop('pop-mat', {
        rotulo: 'Material', titulo: 'Filtrar por material', icone: 'fa-vial', busca: 'Buscar material…', limpavel: true, padrao: '',
        opcoes: () => [{ valor: '', rotulo: 'Todos os materiais', icone: 'fa-layer-group', qtd: DADOS.linhas.length },
          ...Object.entries(mats).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pt-BR')).map(([m, n]) => ({ valor: m, rotulo: m, icone: 'fa-vial', qtd: n }))],
        aoMudar: () => { F.pag = 1; desenharLista(); }
      });
      if (POPS['pop-mat'].valor && !mats[POPS['pop-mat'].valor]) { POPS['pop-mat'].valor = ''; desenharBotaoPop('pop-mat'); }
      criarPop('pop-prazo', {
        rotulo: 'Prazo', titulo: 'Filtrar por prazo', icone: 'fa-clock', limpavel: true, padrao: '',
        opcoes: () => [{ valor: '', rotulo: 'Todos os prazos', icone: 'fa-layer-group', qtd: DADOS.linhas.length },
          ...Object.entries(PRAZOS).map(([k, p]) => ({ valor: k, rotulo: p.nome, icone: 'fa-clock', qtd: DADOS.linhas.filter(p.f).length })).filter(o => o.qtd)],
        aoMudar: () => { F.pag = 1; desenharLista(); }
      });
      desenharLista();
    }

    const thOrdem = (rotulo, chave, cls = '') =>
      `<th class="ord ${cls} ${F.ordem === chave ? 'on' : ''}" onclick="ordenar('${chave}')">${rotulo} <i class="fa-solid ${F.ordem === chave ? (F.dir > 0 ? 'fa-arrow-up-short-wide' : 'fa-arrow-down-wide-short') : 'fa-sort'}"></i></th>`;
    function ordenar(chave) {
      if (F.ordem === chave) F.dir = -F.dir; else { F.ordem = chave; F.dir = 1; }
      F.pag = 1;
      desenharLista();
    }

    function desenharLista() {
      const mat = valorPop('pop-mat'), pz = PRAZOS[valorPop('pop-prazo')], termos = F.q.split(/\s+/).map(soLetras).filter(Boolean);
      const base = DADOS.linhas.filter(x => (!mat || x.material === mat) && (!pz || pz.f(x)) && termos.every(t => x.busca.includes(t)));
      $('q-limpar').style.display = F.q ? '' : 'none';
      if (F.filtro && !base.some(FILTROS[F.filtro].f)) F.filtro = '';
      $('chips').innerHTML = `<button class="chip ${!F.filtro ? 'on' : ''}" onclick="F.filtro='';F.pag=1;desenharLista()"><i class="fa-solid fa-list"></i>Todos <b>${base.length}</b></button>` +
        Object.entries(FILTROS).map(([k, f]) => [k, f, base.filter(f.f).length]).filter(([, , n]) => n)
          .map(([k, f, n]) => `<button class="chip ${F.filtro === k ? 'on' : ''}" onclick="F.filtro='${k}';F.pag=1;desenharLista()"><i class="fa-solid ${f.icone}"></i>${f.nome} <b>${n}</b></button>`).join('');
      const txt = (a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base', numeric: true });
      const ord = { mn: (a, b) => txt(a.mn, b.mn), nome: (a, b) => txt(a.nome, b.nome), material: (a, b) => txt(a.material || '￿', b.material || '￿'),
        prazo: (a, b) => (a.dias ?? 1e9) - (b.dias ?? 1e9), valor: (a, b) => a.valor - b.valor }[F.ordem];
      const ls = base.filter(x => !F.filtro || FILTROS[F.filtro].f(x)).sort((a, b) => ord(a, b) * F.dir || txt(a.nome, b.nome));
      const n = Math.max(1, Math.ceil(ls.length / POR_PAG));
      if (F.pag > n) F.pag = n;
      _vis = ls.slice((F.pag - 1) * POR_PAG, F.pag * POR_PAG);
      $('cab').innerHTML = `<tr>${thOrdem('MN', 'mn', 'col-mn')}${thOrdem('Exame', 'nome')}${thOrdem('Material', 'material', 'col-mat')}${thOrdem('Prazo', 'prazo', 'col-prazo')}${thOrdem('Valor', 'valor', 'num')}<th></th></tr>`;
      $('corpo').innerHTML = _vis.map((x, i) => `
        <tr class="row" onclick="abrirExame(${i})">
          <td class="mn col-mn">${esc(x.mn)}</td>
          <td class="desc"><div class="nome" title="${esc(x.nome)}">${esc(x.nome)}</div>
            <div class="sub-m"><span class="mn">${esc(x.mn)}</span>${x.material ? ' · ' + esc(x.material) : ''}${x.prazo ? ' · ' + esc(x.prazo) : ''}</div></td>
          <td class="col-mat">${x.material ? `<span class="tag" title="${esc(x.material)}"><i class="fa-solid fa-vial"></i>${esc(x.material)}</span>` : '<span class="muted">—</span>'}</td>
          <td class="col-prazo">${esc(x.prazo) || '<span class="muted">—</span>'}</td>
          <td class="num"><b>${fmt(x.valor)}</b>${x.neg ? '<i class="fa-solid fa-handshake neg" title="Valor negociado"></i>' : ''}</td>
          <td class="ic">${x.instrucao ? '<i class="fa-solid fa-file-lines" title="Tem instrução"></i>' : ''}${x.anexos.length ? `<i class="fa-solid fa-paperclip" title="${x.anexos.length} anexo(s)"></i>` : ''}<i class="fa-solid fa-chevron-right"></i></td></tr>`).join('')
        || `<tr><td colspan="6">${DADOS.linhas.length ? vazio('fa-magnifying-glass', '<b>Nenhum exame encontrado</b><br>Confira a busca e os filtros.') : vazio('fa-flask-vial', '<b>Tabela sem exames</b><br>Fale com o Laboratório LAMIC.')}</td></tr>`;
      $('rodape').innerHTML = paginacao(ls.length, F.pag);
    }

    function paginacao(total, pag) {
      const n = Math.max(1, Math.ceil(total / POR_PAG));
      if (n <= 1) return `<span>${total} exame(s)</span>`;
      const ini = (pag - 1) * POR_PAG + 1, fim = Math.min(total, pag * POR_PAG);
      const nums = [...new Set([1, pag - 1, pag, pag + 1, n])].filter(p => p >= 1 && p <= n).sort((a, b) => a - b);
      let h = '', ant = 0;
      nums.forEach(p => { if (p - ant > 1) h += '<span class="pg-gap">…</span>'; h += `<button class="pg ${p === pag ? 'on' : ''}" onclick="irPagina(${p})">${p}</button>`; ant = p; });
      return `<span>${ini}–${fim} de ${total} exames</span><div class="pgs">
        <button class="pg" ${pag <= 1 ? 'disabled' : ''} onclick="irPagina(${pag - 1})" title="Anterior"><i class="fa-solid fa-chevron-left"></i></button>${h}
        <button class="pg" ${pag >= n ? 'disabled' : ''} onclick="irPagina(${pag + 1})" title="Próxima"><i class="fa-solid fa-chevron-right"></i></button></div>`;
    }
    function irPagina(p) {
      F.pag = p;
      desenharLista();
      $('page').querySelector('.card').scrollIntoView({ block: 'start', behavior: 'smooth' });
    }

    // ── Detalhes do exame: instrução e anexos ─────────────────────
    function iconeAnexo(a) {
      if (/\.pdf(\?|#|$)/i.test(a.url) || /\.pdf$/i.test(a.nome)) return 'fa-file-pdf';
      if (/docs\.google\.com\/(document|forms)/i.test(a.url)) return 'fa-file-lines';
      return 'fa-paperclip';
    }
    const dominio = url => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };

    let _aberto = null;
    // Só recolhe o campo que passa de 4 linhas (recolhido mostra 3)
    function recolherSecoes() {
      document.querySelectorAll('.secs .sec').forEach(s => s.classList.toggle('corta', s.querySelector('.sec-tx').scrollHeight > 96));
    }
    function alternarSecao(bt) {
      const aberta = bt.parentElement.classList.toggle('aberta');
      bt.querySelector('span').textContent = aberta ? 'Ver menos' : 'Ver mais';
    }
    function abrirExame(i) {
      const x = _aberto = _vis[i];
      if (!x) return;
      abrirGaveta({
        sobre: x.mn, titulo: x.nome,
        meta: `${x.material ? `<span class="tag"><i class="fa-solid fa-vial"></i>${esc(x.material)}</span>` : ''}${x.prazo ? `<span class="tag"><i class="fa-solid fa-clock"></i>${esc(x.prazo)}</span>` : ''}`,
        corpo: `<div class="valor-box"><div><div class="l">Valor do exame</div><div class="v">${fmt(x.valor)}</div></div>
            ${x.neg ? '<span class="badge-s ok"><i class="fa-solid fa-handshake"></i>Valor negociado</span>' : ''}</div>
          <div class="sec-t"><i class="fa-solid fa-file-lines"></i>Instruções</div>
          ${x.instrucao ? `<div class="secs">${Object.entries(x.secoes).map(([k, t]) => `<section class="sec" style="--c:${SECOES[k].cor}">
              <div class="sec-h"><span class="sec-ic"><i class="fa-solid ${SECOES[k].icone}"></i></span><b>${SECOES[k].nome}</b>
                <button class="sec-cp" title="Copiar ${SECOES[k].nome}" onclick="copiarSecao('${k}')"><i class="fa-solid fa-copy"></i></button></div>
              <div class="sec-b"><div class="sec-tx">${htmlTextoSecao(t)}</div></div>
              <button class="sec-mais" onclick="alternarSecao(this)"><span>Ver mais</span><i class="fa-solid fa-chevron-down"></i></button></section>`).join('')}</div>` : '<div class="muted" style="font-size:13px">Sem instrução cadastrada para este exame.</div>'}
          ${x.anexos.length ? `<div class="sec-t"><i class="fa-solid fa-paperclip"></i>Anexos</div>
            <div class="anexos">${x.anexos.map(a => `<a class="anexo" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
              <span class="po-ic"><i class="fa-solid ${iconeAnexo(a)}"></i></span><span class="tx"><b>${esc(a.nome)}</b><small>${esc(dominio(a.url))}</small></span>
              <i class="fa-solid fa-arrow-up-right-from-square"></i></a>`).join('')}</div>` : ''}`,
        rodape: `<span class="muted" style="font-size:12px">${i + 1 + (F.pag - 1) * POR_PAG}º da lista</span>
          <div style="display:flex;gap:8px"><button class="btn" ${i > 0 ? '' : 'disabled'} onclick="abrirExame(${i - 1})" title="Exame anterior"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="btn" ${i < _vis.length - 1 ? '' : 'disabled'} onclick="abrirExame(${i + 1})" title="Próximo exame"><i class="fa-solid fa-chevron-right"></i></button>
          <button class="btn pri" onclick="fecharGaveta()">Fechar</button></div>`
      });
      recolherSecoes();
    }

    // ── Proposta em PDF (acesso interno) ──────────────────────────
    const LOGO_PDF = 'https://i.imgur.com/qVfGMyc.png';
    const TEXTO_APRESENTACAO = `Ao (Nome fantasia e CNPJ)

Prezado(a) Senhor(a),

    É com grande satisfação que encaminhamos para apreciação de V.Sa, a nossa proposta orçamentária, para realização de exames laboratoriais de nossa especialidade.
    Salientamos que todos os exames aqui apresentados estão disponíveis para imediata realização.
    Ademais, ressaltamos que a estrutura do Núcleo Técnico Operacional – NTO do Laboratório LAMIC está apta a realizar uma gama de aproximadamente 2.000 (dois mil) diferentes exames, e desta forma, caso vossa senhoria demande a realização de algum(ns) exame(s) que não esteja(m) detalhado(s) na presente proposta, encontramo-nos a disposição para apresentar proposta específica para o(s) mesmo(s).
    A recepção dos materiais para análise obedecerá aos seguintes horários:

    Juazeiro do Norte (NTO – Centro) – ÁREA TÉCNICA
• Segunda-feira à Sexta-feira: 06h00 às 17h00
• Sábado: 06h00 às 12h00

    Entrega dos Resultados:
    Os prazos de entrega dos resultados dos exames estão evidenciados ao lado da descrição de cada exame na relação anexa à presente proposta e levam em consideração o horário da entrada do material coletado na área técnica do Laboratório LAMIC.`;
    const TEXTO_FECHAMENTO = `Encontramo-nos à disposição para esclarecer eventuais dúvidas julgadas necessárias acerca do presente orçamento.
Atenciosamente, Dr. Leonardo Bezerra
Laboratório LAMIC`;

    function abrirProposta() {
      const m = $('modal');
      m.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true">
          <h3>Texto de apresentação da proposta</h3><p>O PDF leva este texto, a relação de ${DADOS.linhas.length} exames (material, prazo e valor) e o fechamento.</p>
          <textarea class="txt-grande" id="p-texto"></textarea>
          <div class="modal-acoes"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" id="p-baixar" onclick="baixarProposta()"><i class="fa-solid fa-download"></i>Baixar PDF</button></div>
        </div>`;
      $('p-texto').value = TEXTO_APRESENTACAO;
      m.classList.add('open');
      m.onclick = e => { if (e.target === m) fecharModal(); };
    }
    function fecharModal() { $('modal').classList.remove('open'); }

    const carregarScript = src => new Promise((ok, erro) => {
      const s = document.createElement('script');
      s.src = src; s.onload = ok; s.onerror = () => erro(new Error('Falha ao carregar ' + src));
      document.head.appendChild(s);
    });
    function dataPorExtenso() {
      const meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'], d = new Date();
      return `Juazeiro do Norte/CE, ${String(d.getDate()).padStart(2, '0')} de ${meses[d.getMonth()]} de ${d.getFullYear()}.`;
    }

    async function baixarProposta() {
      const b = $('p-baixar'), texto = $('p-texto').value || TEXTO_APRESENTACAO;
      b.disabled = true; b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>Gerando…';
      try {
        if (!window.jspdf) {
          await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
          await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js');
        }
        const doc = new window.jspdf.jsPDF();
        let y = 20;
        try {               // logotipo centralizado no topo
          const img = new Image();
          img.crossOrigin = 'anonymous'; img.src = LOGO_PDF;
          await new Promise((ok, erro) => { img.onload = ok; img.onerror = () => erro(new Error('logo')); });
          const cv = document.createElement('canvas');
          cv.width = img.naturalWidth; cv.height = img.naturalHeight;
          cv.getContext('2d').drawImage(img, 0, 0);
          const lg = 60, alt = lg * img.naturalHeight / img.naturalWidth;
          doc.addImage(cv.toDataURL('image/png'), 'PNG', (210 - lg) / 2, 10, lg, alt);
          y = 10 + alt + 10;
        } catch (e) { console.warn('Logotipo não carregado:', e); }
        doc.setTextColor(44, 62, 80);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
        doc.text('Proposta de Exames', 105, y, { align: 'center' });
        doc.setFont('helvetica', 'normal'); doc.setFontSize(12);
        doc.text(dataPorExtenso(), 105, y + 10, { align: 'center' });
        y += 20;
        doc.splitTextToSize(texto, 180).forEach(l => {      // texto longo continua na página seguinte
          if (y > 285) { doc.addPage(); y = 20; }
          doc.text(l, 15, y); y += 5;
        });
        const txt = (a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base', numeric: true });
        doc.autoTable({
          startY: y + 5,
          head: [['Exame', 'Material Biológico', 'Prazo', 'Valor']],
          body: [...DADOS.linhas].sort((a, b) => txt(a.nome, b.nome)).map(x => [x.nome, x.material || 'N/A', x.prazo || 'N/A', fmt(x.valor)]),
          theme: 'striped',
          styles: { fontSize: 9, cellPadding: 4, overflow: 'linebreak', font: 'helvetica', fontStyle: 'normal' },
          columnStyles: { 0: { cellWidth: 90 }, 1: { cellWidth: 35 }, 2: { cellWidth: 32 }, 3: { cellWidth: 32 } },
          headStyles: { fillColor: [26, 43, 95], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 10 }
        });
        y = doc.lastAutoTable.finalY + 10;
        const fecho = doc.splitTextToSize(TEXTO_FECHAMENTO, 180);
        if (y + fecho.length * 5 > 285) { doc.addPage(); y = 20; }
        doc.text(fecho, 15, y);
        doc.save('Lista de Exames - LAMIC.pdf');
        fecharModal();
        toast('Proposta gerada');
      } catch (e) {
        console.error(e);
        toast('Não foi possível gerar o PDF. Verifique a internet.', 'erro');
        b.disabled = false; b.innerHTML = '<i class="fa-solid fa-download"></i>Baixar PDF';
      }
    }

    // ── Início ────────────────────────────────────────────────────
    function iniciar() {
      temaInicial();
      mostrarAuth('carregando');
      // Sem resposta do banco em 12 s → tela de erro
      const limite = setTimeout(() => mostrarAuth('erro-conexao'), 12000);
      let primeira = true;
      DB.ouvir('l2l/acessos', v => {
        ACESSOS = v || {};
        if (primeira) {
          primeira = false; clearTimeout(limite);
          const id = sessaoValida();
          return id ? abrirApp(id) : mostrarAuth('login');
        }
        // acesso bloqueado, removido ou com senha redefinida no Comercial
        if (acesso && !acessoVale(acesso.id, acesso.m)) sair('Sua sessão foi encerrada. Entre novamente.');
      });
    }

    // ── Instalar como aplicativo (PWA) ────────────────────────────
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
    function showInstallBanner() {
      if (localStorage.getItem('installPromptDismissed') || localStorage.getItem('appInstalled')) return;
      const banner = $('install-banner');
      setTimeout(() => { if (deferredPrompt) banner.classList.add('show'); }, 1500);
      $('install-app-button').addEventListener('click', () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(r => {
          if (r.outcome === 'accepted') localStorage.setItem('appInstalled', 'true');
          deferredPrompt = null;
          banner.classList.remove('show');
        });
      });
      document.querySelector('.close-install').addEventListener('click', () => {
        localStorage.setItem('installPromptDismissed', 'true');
        banner.classList.remove('show');
      });
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('https://raw.githubusercontent.com/LaboratorioLamic/L2L/refs/heads/main/service-worker.js', { scope: '/' })
        .catch(e => console.warn('Service Worker não registrado:', e.message));
    }

    window.addEventListener('load', () => { iniciar(); showInstallBanner(); });

    // ── Bloqueio de inspeção (como na versão anterior) ────────────
    function ctrlShiftKey(e, keyCode) { return e.ctrlKey && e.shiftKey && e.keyCode === keyCode.charCodeAt(0); }
    document.onkeydown = function (event) {
      if (event.keyCode === 123 || ctrlShiftKey(event, 'I') || ctrlShiftKey(event, 'J') || ctrlShiftKey(event, 'C') ||
        (event.ctrlKey && event.keyCode === 'U'.charCodeAt(0)) || (event.ctrlKey && event.keyCode === 'S'.charCodeAt(0))) {
        event.preventDefault();
        return false;
      }
    };
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
